name: printharbor

services:
  printharbor:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_USER: ${ADMIN_USER:-admin}
    ports:
      - "47831"
    volumes:
      - printharbor-data:/data
      - printharbor-cups:/etc/cups
      - printharbor-spool:/var/spool/cups

volumes:
  printharbor-data:
  printharbor-cups:
  printharbor-spool:
